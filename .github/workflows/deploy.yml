name: Build and deploy

on:
  push:
    branches: [main]

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Set image URI
        id: image
        shell: bash
        run: echo "uri=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}:${{ github.sha }}
            ${{ steps.image.outputs.uri }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          APP_REPOSITORY: ${{ github.repository }}
          APP_COMMIT: ${{ github.sha }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_URI,IMAGE_TAG,APP_REPOSITORY,APP_COMMIT,DEPLOY_PATH
          script_stop: true
          script: |
            set -eu
            # Set repository Actions variable DEPLOY_PATH to the VPS checkout's absolute path.
            : "${DEPLOY_PATH:?Set repository Actions variable DEPLOY_PATH to the VPS checkout path}"
            case "$DEPLOY_PATH" in /*) ;; *) echo "DEPLOY_PATH must be absolute" >&2; exit 2 ;; esac
            cd "$DEPLOY_PATH"
            git fetch --depth=1 origin "$APP_COMMIT"
            git checkout --force "$APP_COMMIT"
            bash scripts/deploy.sh "$IMAGE_URI" "$IMAGE_TAG"
